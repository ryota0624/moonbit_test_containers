name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-native:
    name: Test (Native Backend)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        run: |
          moon version --all

      - name: Update MoonBit dependencies
        run: moon update

      - name: Check Docker availability
        run: |
          docker --version
          docker ps

      - name: Run tests (Native backend)
        run: moon test --target native
        timeout-minutes: 10

  test-js:
    name: Test (JavaScript Backend)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node.js installation
        run: |
          node --version
          npm --version

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit installation
        run: |
          moon version --all

      - name: Update MoonBit dependencies
        run: moon update

      - name: Check Docker availability
        run: |
          docker --version
          docker ps

      - name: Run tests (JavaScript backend)
        run: moon test --target js
        timeout-minutes: 10

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-native, test-js]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-native.result }}" == "success" ] && [ "${{ needs.test-js.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed:"
            echo "  Native: ${{ needs.test-native.result }}"
            echo "  JavaScript: ${{ needs.test-js.result }}"
            exit 1
          fi
